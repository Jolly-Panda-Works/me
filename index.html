<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jolly Panda Profile</title>
  <meta name="robots" content="noindex, follow" />
  <!-- No-JS / slow-JS fallback: lands on the primary (English) version. -->
  <meta http-equiv="refresh" content="0; url=/en/" />
  <link rel="canonical" href="https://me.jollypanda.ir/en/" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <script>
    // Route returning visitors to whichever language they last used, and
    // first-time visitors to a language matching their browser — English
    // is the site's primary language and the default in every other case.
    (function () {
      var STORAGE_KEY = "jollypanda:me:lang";
      var target = "/en/";
      try {
        var stored = localStorage.getItem(STORAGE_KEY);
        if (stored === "fa") target = "/fa/";
        else if (stored === "en") target = "/en/";
        else if ((navigator.language || "").slice(0, 2) === "fa") target = "/fa/";
      } catch (e) {
        if ((navigator.language || "").slice(0, 2) === "fa") target = "/fa/";
      }
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <p>
    Redirecting to Jolly Panda Profile —
    <a href="/en/">English</a> / <a href="/fa/">فارسی</a>
  </p>
</body>
</html>

name: Update Persian prices

# Persian prices = USD package price x Navasan dollar rate (see scripts/update-prices.mjs).
# Needs the repository secret NAVASAN_API_KEY.
# Optional: VERCEL_DEPLOY_HOOK (same secret redeploy.yml uses) to deploy right after the commit.
on:
  schedule:
    - cron: "30 2 * * *"      # every day 02:30 UTC = 06:00 Tehran
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch rate and rewrite Persian prices
        env:
          NAVASAN_API_KEY: ${{ secrets.NAVASAN_API_KEY }}
        run: node scripts/update-prices.mjs

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lang/fa.json fa/index.html content/last-rate.json
          git commit -m "chore: update Persian prices from today's USD rate"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "VERCEL_DEPLOY_HOOK not set — relying on Vercel's push deploy."; fi
